id: datago.tour_kor_festival
provider: datago
title: 한국관광공사 행사정보
description: 한국관광공사 TourAPI 2.0. 2026-09 기준 MobileOS·MobileApp이 필수이고 listYN은 폐지되었다.
source:
  url: https://www.data.go.kr/data/15101578/openapi.do
  verified_at: '2026-09-10'
endpoint:
  base_url: http://apis.data.go.kr/B551011/KorService2
  operation: searchFestival2
  method: GET
  format_param:
    name: _type
    values:
      json: json
      xml: xml
auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago
params:
- name: MobileOS
  type: string
  required: true
  description: OS 구분 (ETC 고정)
  example: ETC
- name: MobileApp
  type: string
  required: true
  description: 응용프로그램명
  example: kpubdata
- name: eventStartDate
  type: date_yyyymmdd
  required: false
  description: 행사 시작일
  example: '20260101'
- name: eventEndDate
  type: date_yyyymmdd
  required: false
  description: 행사 종료일
  example: '20261231'
response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values:
    - '00'
    - '000'
    - '0000'
    - 0
pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000
fields:
- name: addr1
  type: string
  title: 주소
  semantic_kind: text
  description: 주소
- name: addr2
  type: string
  title: 상세주소
  semantic_kind: text
  description: 상세주소
- name: areacode
  type: string
  title: 지역 코드
  semantic_kind: code
  description: 지역 코드
- name: cat1
  type: string
  title: 대분류 코드
  semantic_kind: code
  description: 대분류
- name: cat2
  type: string
  title: 중분류 코드
  semantic_kind: code
  description: 중분류
- name: cat3
  type: string
  title: 소분류 코드
  semantic_kind: code
  description: 소분류
- name: contentid
  type: integer
  title: 콘텐츠 ID
  description: 콘텐츠 ID
- name: contenttypeid
