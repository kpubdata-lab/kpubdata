id: datago.apt_trade
provider: datago
title: 아파트매매 실거래가
description: 국토교통부에서 제공하는 아파트 매매 실거래 데이터입니다. 지역코드와 거래연월을 필수 조건으로 조회합니다.
source:
  url: https://www.data.go.kr
  verified_at: '2026-04-21'
endpoint:
  base_url: http://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev
  operation: getRTMSDataSvcAptTradeDev
  method: GET
  format_param:
    name: resultType
    values:
      json: json
      xml: xml
auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago
params:
- name: LAWD_CD
  type: string
  required: true
  description: 지역코드 (5자리)
  example: '11110'
- name: DEAL_YMD
  type: date_yyyymm
  required: true
  description: 거래연월 (YYYYMM 형식)
  example: '202401'
response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values:
    - '00'
    - '000'
    - 0
pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000
fields:
- name: aptDong
  type: integer
  title: 아파트 동
- name: aptNm
  type: string
  title: 아파트명
  semantic_kind: text
  description: 아파트 이름
- name: aptSeq
  type: string
  title: 단지 일련번호
  semantic_kind: code
- name: bonbun
  type: string
  title: 지번 본번
  semantic_kind: code
  description: 본번
- name: bubun
  type: string
  title: 지번 부번
  semantic_kind: code
  description: 부번
- name: buildYear
  type: integer
  title: 건축년도
  description: 건축연도
- name: buyerGbn
  type: string
  title: 매수자 구분
  semantic_kind: code
  description: 매수자 구분
- name: cdealDay
  type: string
  title: 계약 해제 사유 발생일
  semantic_kind: date
  description: 해제사유 발생일
- name: cdealType
  type: string
  title: 계약 해제 여부
  semantic_kind: code
  description: 해제사유 발생일
- name: dealAmount
  type: integer
  title: 거래금액
  unit: 만원
  semantic_kind: measure
  description: 거래금액(만원)
- name: dealDay
  type: integer
  title: 계약일
  description: 거래일
- name: dealMonth
  type: integer
  title: 계약월
  description: 거래월
- name: dealYear
  type: integer
  title: 계약년도
  description: 거래연도
- name: dealingGbn
  type: string
  title: 거래 유형
  semantic_kind: code
- name: estateAgentSggNm
  type: string
  title: 중개사 소재지
  semantic_kind: text
  description: 중개사 소재지
- name: excluUseAr
  type: string
  title: 전용면적
  unit: ㎡
  description: 전용면적
- name: floor
  type: integer
  title: 층
  semantic_kind: measure
  description: 층
- name: jibun
  type: integer
  title: 지번
  description: 지번
- name: landCd
  type: integer
  title: 법정동 지번코드
- name: landLeaseholdGbn
  type: string
  title: 토지임대부 아파트 여부
  semantic_kind: code
- name: rgstDate
  type: string
  title: 등기일자
  semantic_kind: date
  description: 등기일
- name: roadNm
  type: string
  title: 도로명
  semantic_kind: text
- name: roadNmBonbun
  type: string
  title: 도로명 건물 본번호
  semantic_kind: code
- name: roadNmBubun
  type: string
  title: 도로명 건물 부번호
  semantic_kind: code
- name: roadNmCd
  type: integer
  title: 도로명 코드
- name: roadNmSeq
  type: string
  title: 도로명 일련번호
  semantic_kind: code
- name: roadNmSggCd
  type: integer
  title: 도로명 시군구코드
- name: roadNmbCd
  type: integer
  title: 도로명 지상지하 코드
- name: sggCd
  type: integer
  title: 시군구 코드
  description: 시군구 코드
- name: slerGbn
  type: string
  title: 매도자 구분
  semantic_kind: code
- name: umdCd
  type: integer
  title: 법정동 코드
- name: umdNm
  type: string
  title: 법정동명
  semantic_kind: text
  description: 법정동 이름
examples:
- name: seoul_gangnam_2024_01
  description: 서울 강남구 2024년 1월 아파트 매매 실거래가
  params:
    LAWD_CD: '11110'
    DEAL_YMD: '202401'
  page: 1
  page_size: 100
- name: seoul_gangnam_2024_01_full_page
  description: 서울 강남구 2024년 1월 매매가 (최대 행)
  params:
    LAWD_CD: '11110'
    DEAL_YMD: '202401'
  page: 1
  page_size: 1000
status: active
last_verified: "2026-09-12"
