id: datago.sh_trade
provider: datago
title: 단독/다가구 매매 실거래자료 (Single House Trade)
description: MOLIT single house trade real transaction data
source:
  url: https://www.data.go.kr
endpoint:
  base_url: http://apis.data.go.kr/1613000/RTMSDataSvcSHTrade
  operation: getRTMSDataSvcSHTrade
  method: GET
  format_param:
    name: resultType
    values:
      json: json
      xml: xml
auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago
params:
- name: LAWD_CD
  type: string
  required: true
  description: 지역코드 (5자리)
  example: '11110'
- name: DEAL_YMD
  type: date_yyyymm
  required: true
  description: 거래연월 (YYYYMM)
  example: '202401'
response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values:
    - '00'
    - '000'
    - 0
pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000
fields:
- name: buildYear
  type: integer
  description: 건축연도
- name: buyerGbn
  type: string
  description: 매수자 구분
- name: cdealDay
  type: string
  description: 해제사유 발생일
- name: cdealType
  type: string
  description: 해제사유 발생일
- name: dealAmount
  type: integer
  description: 거래금액(만원)
- name: dealDay
  type: integer
  description: 거래일
- name: dealMonth
  type: integer
  description: 거래월
- name: dealYear
  type: integer
  description: 거래연도
- name: dealingGbn
  type: string
- name: estateAgentSggNm
  type: string
  description: 중개사 소재지
- name: houseType
  type: string
- name: jibun
  type: string
  description: 지번
- name: plottageAr
  type: integer
- name: sggCd
  type: integer
  description: 시군구 코드
- name: slerGbn
  type: string
- name: totalFloorAr
  type: string
- name: umdNm
  type: string
  description: 법정동 이름
license:
  type: "공공누리_1유형"
  redistribution: allowed
  note: "Terms not yet confirmed — fill from provider page (#524)"
examples:
- name: seoul_gangnam
  description: 서울 강남구 2024-01
  params:
    LAWD_CD: '11110'
    DEAL_YMD: '202401'
  page: 1
  page_size: 10
status: active
last_verified: '2026-09-09'
