id: datago.tour_kor_keyword
provider: datago
title: 한국관광공사 키워드 검색
description: 한국관광공사 TourAPI 2.0. 2026-09 기준 MobileOS·MobileApp이 필수이고 listYN은 폐지되었다.
source:
  url: https://www.data.go.kr/data/15101578/openapi.do
  verified_at: '2026-09-10'
endpoint:
  base_url: http://apis.data.go.kr/B551011/KorService2
  operation: searchKeyword2
  method: GET
  format_param:
    name: _type
    values:
      json: json
      xml: xml
auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago
params:
- name: MobileOS
  type: string
  required: true
  description: OS 구분 (ETC 고정)
  example: ETC
- name: MobileApp
  type: string
  required: true
  description: 응용프로그램명
  example: kpubdata
- name: keyword
  type: string
  required: true
  description: 검색 키워드
  example: 강남
- name: contentTypeId
  type: string
  required: false
  description: 관광타입 (39=음식점)
  example: '39'
response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values:
    - '00'
    - '000'
    - '0000'
    - 0
pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000
fields:
- name: addr1
  type: string
  description: 주소
- name: addr2
  type: string
  description: 상세주소
- name: areacode
  type: integer
  description: 지역 코드
- name: cat1
  type: string
  description: 대분류
- name: cat2
  type: string
  description: 중분류
- name: cat3
  type: string
  description: 소분류
- name: contentid
  type: integer
  description: 콘텐츠 ID
- name: contenttypeid
  type: integer
  description: 콘텐츠 타입 ID
- name: cpyrhtDivCd
  type: string
- name: createdtime
  type: integer
  description: 등록일시
- name: firstimage
  type: string
  description: 대표 이미지
- name: firstimage2
  type: string
- name: lDongRegnCd
  type: integer
- name: lDongSignguCd
  type: integer
- name: lclsSystm1
  type: string
- name: lclsSystm2
  type: string
- name: lclsSystm3
  type: string
- name: mapx
  type: string
  description: 경도
- name: mapy
  type: string
  description: 위도
- name: mlevel
  type: integer
  description: 맵 레벨
- name: modifiedtime
  type: integer
  description: 수정일시
- name: sigungucode
  type: integer
  description: 시군구 코드
- name: tel
  type: string
  description: 전화번호
- name: title
  type: string
  description: 제목
- name: zipcode
  type: string
  semantic_kind: code
examples:
- name: gangnam_keyword
  description: 키워드 강남 음식점
  params:
    MobileOS: ETC
    MobileApp: kpubdata
    keyword: 강남
    contentTypeId: '39'
  page: 1
  page_size: 10
status: active
last_verified: '2026-09-10'
