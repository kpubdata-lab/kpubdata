id: datago.village_fcst
provider: datago
title: 단기예보 조회서비스
description: 기상청의 단기예보 데이터를 조회합니다. 기준일시, 격자좌표(nx, ny)를 필수 조건으로 하며 JSON/XML 형식 모두 지원합니다.
source:
  url: https://www.data.go.kr
  verified_at: '2026-04-21'
endpoint:
  base_url: http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  operation: getVilageFcst
  method: GET
  format_param:
    name: dataType
    values:
      json: JSON
      xml: XML
auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago
params:
- name: base_date
  type: date_yyyymmdd
  required: true
  description: 기준일 (YYYYMMDD 형식)
  example: '20260908'
- name: base_time
  type: string
  required: true
  description: '기준시간 (HHMM 형식, 예: 0500, 1100, 2300)'
  example: '2300'
- name: nx
  type: integer
  required: true
  description: 예보지점 X 격자값
  example: 55
- name: ny
  type: integer
  required: true
  description: 예보지점 Y 격자값
  example: 127
response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values:
    - '00'
    - '000'
    - 0
pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000
fields:
- name: baseDate
  type: integer
  title: 발표일자
  description: 발표 날짜
- name: baseTime
  type: integer
  title: 발표시각
  description: 발표 시각
- name: category
  type: string
  title: 자료 구분
  semantic_kind: code
  description: 예보 구분
- name: fcstDate
  type: integer
  title: 예보일자
  description: 예보 날짜
- name: fcstTime
  type: string
  title: 예보시각
  semantic_kind: code
  description: 예보 시각
- name: fcstValue
  type: integer
  title: 예보 값
  description: 예보 값
- name: nx
  type: integer
  title: 예보지점 X 좌표
  description: 격자 X
- name: ny
  type: integer
  title: 예보지점 Y 좌표
  description: 격자 Y
examples:
- name: seoul_default
  description: 서울 지역 기본 예보 조회 (JSON)
  params:
    base_date: '20260908'
    base_time: '2300'
    nx: 55
    ny: 127
  page: 1
  page_size: 100
- name: seoul_evening
  description: 서울 지역 저녁 시간대 예보 (JSON)
  params:
    base_date: '20260908'
    base_time: '2300'
    nx: 55
    ny: 127
  page: 1
  page_size: 100
- name: xml_response
  description: 서울 지역 예보 (XML 형식)
  params:
    base_date: '20260908'
    base_time: '2300'
    nx: 55
    ny: 127
  format: xml
  page: 1
  page_size: 100
status: active
last_verified: '2026-09-09'
license:
  type: 공공누리_1유형
  commercial_use: true
  attribution_required: true
  modification_allowed: true
  redistribution: allowed
  attribution: "공공누리 제1유형(출처표시) — 기상청 동네예보"
