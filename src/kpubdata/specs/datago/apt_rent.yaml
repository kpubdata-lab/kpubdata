id: datago.apt_rent
provider: datago
title: 아파트 전월세 실거래자료 (Apartment Rent)
description: MOLIT apartment rent real transaction data
source:
  url: https://www.data.go.kr
endpoint:
  base_url: http://apis.data.go.kr/1613000/RTMSDataSvcAptRent
  operation: getRTMSDataSvcAptRent
  method: GET
  format_param:
    name: resultType
    values:
      json: json
      xml: xml
auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago
params:
- name: LAWD_CD
  type: string
  required: true
  description: 지역코드 (5자리)
  example: '11110'
- name: DEAL_YMD
  type: date_yyyymm
  required: true
  description: 거래연월 (YYYYMM)
  example: '202401'
response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values:
    - '00'
    - '000'
    - 0
pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000
fields:
- name: aptNm
  type: string
  description: 아파트 이름
- name: aptSeq
  type: string
- name: buildYear
  type: integer
  description: 건축연도
- name: contractTerm
  type: string
  description: 계약기간
- name: contractType
  type: string
  description: 계약구분
- name: dealDay
  type: integer
  description: 거래일
- name: dealMonth
  type: integer
  description: 거래월
- name: dealYear
  type: integer
  description: 거래연도
- name: deposit
  type: integer
- name: excluUseAr
  type: string
  description: 전용면적
- name: floor
  type: integer
  description: 층
- name: jibun
  type: integer
  description: 지번
- name: monthlyRent
  type: integer
- name: preDeposit
  type: string
- name: preMonthlyRent
  type: string
- name: roadnm
  type: string
- name: roadnmbcd
  type: integer
- name: roadnmbonbun
  type: string
  semantic_kind: code
- name: roadnmbubun
  type: string
  semantic_kind: code
- name: roadnmcd
  type: integer
- name: roadnmseq
  type: integer
- name: roadnmsggcd
  type: integer
- name: sggCd
  type: integer
  description: 시군구 코드
- name: umdNm
  type: string
  description: 법정동 이름
- name: useRRRight
  type: string
examples:
- name: seoul_gangnam
  description: 서울 강남구 2024-01
  params:
    LAWD_CD: '11110'
    DEAL_YMD: '202401'
  page: 1
  page_size: 10
status: active
last_verified: '2026-09-09'
license:
  type: 공공누리_1유형
  commercial_use: true
  attribution_required: true
  modification_allowed: true
