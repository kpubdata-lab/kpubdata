id: datago.airkorea_forecast
provider: datago
title: 에어코리아 대기질 예보통보 (AirKorea Forecast)
description: Daily air quality forecast dispatch (PM10/PM25/O3) with regional grades
source:
  url: https://www.data.go.kr
endpoint:
  base_url: http://apis.data.go.kr/B552584/ArpltnInforInqireSvc
  operation: getMinuDustFrcstDspth
  method: GET
  format_param:
    name: returnType
    values:
      json: json
      xml: xml
auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago
params: []
response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values:
    - '00'
    - '000'
    - 0
pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000
fields: []
license:
  type: "공공누리_1유형"
  redistribution: allowed
  note: "Terms not yet confirmed — fill from provider page (#524)"
examples:
- name: default
  description: 필터 없음 첫 페이지
  params: {}
  page: 1
  page_size: 10
status: active
last_verified: '2026-09-09'
