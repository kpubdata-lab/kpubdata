id: datago.offi_trade
provider: datago
title: 오피스텔 매매 실거래자료 (Officetel Trade)
description: MOLIT officetel trade real transaction data
source:
  url: https://www.data.go.kr
endpoint:
  base_url: http://apis.data.go.kr/1613000/RTMSDataSvcOffiTrade
  operation: getRTMSDataSvcOffiTrade
  method: GET
  format_param:
    name: resultType
    values:
      json: json
      xml: xml
auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago
params:
- name: LAWD_CD
  type: string
  required: true
  description: 지역코드 (5자리)
  example: '11110'
- name: DEAL_YMD
  type: date_yyyymm
  required: true
  description: 거래연월 (YYYYMM)
  example: '202401'
response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values:
    - '00'
    - '000'
    - 0
pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 1000
fields:
- name: buildYear
  type: integer
  title: 건축년도
  description: 건축연도
- name: buyerGbn
  type: string
  title: 매수자 구분
  semantic_kind: code
  description: 매수자 구분
- name: cdealDay
  type: string
  title: 계약 해제 사유 발생일
  semantic_kind: date
  description: 해제사유 발생일
- name: cdealType
  type: string
  title: 계약 해제 여부
  semantic_kind: code
  description: 해제사유 발생일
- name: dealAmount
  type: integer
  title: 거래금액
  unit: 만원
  semantic_kind: measure
  description: 거래금액(만원)
- name: dealDay
  type: integer
  title: 계약일
  description: 거래일
- name: dealMonth
  type: integer
  title: 계약월
  description: 거래월
- name: dealYear
  type: integer
  title: 계약년도
  description: 거래연도
- name: dealingGbn
  type: string
  title: 거래 유형
  semantic_kind: code
- name: estateAgentSggNm
  type: string
  title: 중개사 소재지
  semantic_kind: text
  description: 중개사 소재지
- name: excluUseAr
  type: string
  title: 전용면적
  unit: ㎡
  description: 전용면적
- name: floor
  type: integer
  title: 층
  semantic_kind: measure
  description: 층
- name: jibun
  type: integer
  title: 지번
  description: 지번
- name: offiNm
  type: string
  title: 단지명
  semantic_kind: text
- name: sggCd
  type: integer
  title: 시군구 코드
  description: 시군구 코드
- name: sggNm
  type: string
  title: 시군구명
  semantic_kind: text
- name: slerGbn
  type: string
  title: 매도자 구분
  semantic_kind: code
- name: umdNm
  type: string
  title: 법정동명
  semantic_kind: text
  description: 법정동 이름
license:
  type: "공공누리_1유형"
  redistribution: allowed
  note: "Terms not yet confirmed — fill from provider page (#524)"
examples:
- name: seoul_gangnam
  description: 서울 강남구 2024-01
  params:
    LAWD_CD: '11110'
    DEAL_YMD: '202401'
  page: 1
  page_size: 10
status: active
last_verified: '2026-09-09'
