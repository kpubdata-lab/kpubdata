- name: certiIssuD
  type: string
  description: 인증 발급일 (YYYY-MM-DD)
- name: certiNumV
  type: string
  description: 인증 번호
  semantic_kind: code
- name: entNmV
  type: string
  description: 기업명
- name: faxNo
  type: string
  description: 팩스번호
- name: homepageAddrV
  type: string
  description: 홈페이지 주소
- name: telNo
  type: string
  description: 전화번호
license:
