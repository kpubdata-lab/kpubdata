id: datago.bus_arrival
provider: datago
title: 경기도 버스도착정보
description: 경기도 버스도착정보 조회서비스 v2. 특정 정류장에 도착 예정인 버스의 실시간 도착 정보(차량 번호, 도착 예정 시간, 혼잡도, 남은 좌석)를 조회한다.
source:
  url: https://www.data.go.kr/data/15080346/openapi.do
  verified_at: '2026-10-01'
endpoint:
  base_url: https://apis.data.go.kr/6410000/busarrivalservice/v2
  operation: getBusArrivalListv2
  method: GET
  format_param:
    name: _type
    values:
      json: json
      xml: xml
auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago
params:
- name: stationId
  alias: station
  type: string
  required: true
  description: '정류장 ID. 예: 200000078'
  example: '200000078'
- name: routeId
  alias: route
  type: string
  required: false
  description: 노선 ID (지정 시 해당 노선만)
  example: '121000921'
response:
  format: json
  envelope: datago_standard
  items_path: response.msgBody.busArrivalList
  error:
    style: header_result_code
    code_path: response.msgHeader.resultCode
    ok_values:
    - 0
pagination:
  type: none
fields:
- name: crowded1
  type: string
  title: 첫 번째 버스 혼잡도
  description: 첫 번째 버스 혼잡도 코드
- name: crowded2
  type: string
  title: 두 번째 버스 혼잡도
  description: 두 번째 버스 혼잡도 코드
- name: flag
  type: string
  title: 운행 상태
  description: 운행 상태 (PASS/STOP 등)
- name: locationNo1
  type: integer
  title: 첫 번째 버스 남은 정류장 수
  unit: 정류장
  description: 첫 번째 버스 현재 정류장 순번
- name: locationNo2
  type: integer
  title: 두 번째 버스 남은 정류장 수
  unit: 정류장
  description: 두 번째 버스 현재 정류장 순번
- name: lowPlate1
  type: string
  title: 첫 번째 버스 저상버스 여부
  description: 첫 번째 저상버스 여부
- name: lowPlate2
  type: string
  title: 두 번째 버스 저상버스 여부
  description: 두 번째 저상버스 여부
- name: plateNo1
  type: string
  title: 첫 번째 버스 차량번호
  description: 첫 번째 버스 차량 번호
- name: plateNo2
  type: string
  title: 두 번째 버스 차량번호
  description: 두 번째 버스 차량 번호
- name: predictTime1
  type: integer
  title: 첫 번째 버스 도착 예정 시간
  unit: 분
  description: 첫 번째 버스 도착 예정 시간(분)
- name: predictTime2
  type: integer
  title: 두 번째 버스 도착 예정 시간
  unit: 분
  description: 두 번째 버스 도착 예정 시간(분)
- name: remainSeatCnt1
  type: integer
  title: 첫 번째 버스 빈자리 수
  unit: 석
  description: 첫 번째 버스 잔여 좌석
- name: remainSeatCnt2
  type: integer
  title: 두 번째 버스 빈자리 수
  unit: 석
  description: 두 번째 버스 잔여 좌석
- name: routeDestId
  type: string
  title: 노선 종점 정류소 ID
  semantic_kind: code
  description: 노선 종점 정류장 ID
- name: routeDestName
  type: string
  title: 노선 종점 정류소명
  description: 노선 종점 정류장명
- name: routeId
  type: string
  title: 노선 ID
  semantic_kind: code
  description: 노선 ID
- name: routeName
  type: string
  title: 노선명
  description: 노선명
- name: routeTypeCd
  type: string
  title: 노선 유형 코드
  semantic_kind: code
  description: 노선 유형 코드
- name: staOrder
  type: integer
  title: 정류소 순번
  description: 정류장 순번
- name: stationId
  type: string
  title: 정류소 ID
  semantic_kind: code
  description: 정류장 ID
- name: stationNm1
  type: string
  title: 첫 번째 버스 현재 정류소명
  description: 첫 번째 버스 다음 정류장명
- name: stationNm2
  type: string
  title: 두 번째 버스 현재 정류소명
  description: 두 번째 버스 다음 정류장명
- name: taglessCd1
  type: string
  title: 첫 번째 버스 태그리스 단말기 코드
  description: 첫 번째 버스 교통카드 단말기 코드
- name: taglessCd2
  type: string
  title: 두 번째 버스 태그리스 단말기 코드
  description: 두 번째 버스 교통카드 단말기 코드
- name: turnSeq
  type: integer
  title: 회차 순번
  description: 회차 순번
- name: vehId1
  type: string
  title: 첫 번째 버스 차량 ID
  semantic_kind: code
  description: 첫 번째 버스 차량 ID
- name: vehId2
  type: string
  title: 두 번째 버스 차량 ID
  semantic_kind: code
  description: 두 번째 버스 차량 ID
license:
  redistribution: unknown
  note: "Terms not yet confirmed - fill from provider page https://www.data.go.kr/data/15080346/openapi.do (#524)"
examples:
- name: station_200000078
  description: 정류장 ID 200000078 도착 예정 버스
  params:
    station: '200000078'
  page: 1
  page_size: 10
status: active
last_verified: "2026-10-01"
