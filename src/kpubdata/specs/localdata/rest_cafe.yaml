# catalogue 일괄 변환 생성 (scripts/gen_specs_from_catalogue.py) — 수동 보강 가능
id: localdata.rest_cafe
provider: localdata
title: 휴게음식점 인허가 (Rest Cafe Permits)
description: 휴게음식점 인허가 (Rest Cafe Permits) 데이터셋 (catalogue 일괄 변환).

source:
  url: https://www.data.go.kr

endpoint:
  base_url: http://apis.data.go.kr/1741000/rest_cafes
  operation: info
  method: GET
  format_param:
    name: type
    values:
      json: json
      xml: xml

auth:
  type: query_param
  param_name: serviceKey
  provider_key: datago

params: []

response:
  format: json
  envelope: datago_standard
  items_path: response.body.items.item
  total_count_path: response.body.totalCount
  error:
    style: header_result_code
    code_path: response.header.resultCode
    ok_values: ["00", "000", 0]

pagination:
  type: page_no_rows
  page_param: pageNo
  size_param: numOfRows
  max_size: 100

fields: []

license:
  type: "공공누리_1유형"
  redistribution: allowed
  note: "Terms not yet confirmed — fill from provider page (#524)"
examples:
  - name: default
    description: 필터 없음 첫 페이지
    params: {}
    page: 1
    page_size: 10

status: active
last_verified: "2026-09-09"
