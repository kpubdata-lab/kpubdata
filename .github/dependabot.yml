version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    # CodeQL init/analyze must use the same release and SHA in a single run.
    # Dependabot treats each sub-action as a separate dependency otherwise.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
