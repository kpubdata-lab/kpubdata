name: R3 review
description: >
  Fail a pull request labelled `review:R3` until a person other than its author, with
  write access, currently approves it (#722, kpubdata-builder#905, POLICY 14). Passes
  every other pull request, so the check can be required without leaving any pull
  request waiting for it. Wraps scripts/r3_review.py so the four repositories run one
  rule. Needs only `pull-requests: read`, so it works on fork pull requests too.
  Each approver's repository permission is looked up when the check runs (#860): an
  approval counts only from an account that can push now, and one whose permission
  cannot be read does not count.

inputs:
  pr-number:
    description: "The pull request to check; defaults to the event's"
    required: false
    default: ${{ github.event.pull_request.number }}
  label:
    description: "The label that requires a non-author approval"
    required: false
    default: "review:R3"

outputs:
  passed:
    description: "true or false"
    value: ${{ steps.run.outputs.passed }}
  reason:
    description: "Why"
    value: ${{ steps.run.outputs.reason }}

runs:
  using: composite
  steps:
    # Labels and reviews are read live rather than from the event payload: a re-run
    # replays the old payload, and a run triggered by a review must see the labels as
    # they are now. A failed lookup fails the step — it must never read as "no label".
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        NUMBER: ${{ inputs.pr-number }}
        LABEL: ${{ inputs.label }}
      run: |
        set -euo pipefail
        if ! [[ "${NUMBER}" =~ ^[0-9]+$ ]]; then
          echo "::error::no pull request number (got '${NUMBER}')"
          exit 2
        fi
        dir="${RUNNER_TEMP}/r3-review"
        mkdir -p "${dir}"
        gh api "repos/${REPO}/pulls/${NUMBER}" > "${dir}/pull.json"
        gh api --paginate "repos/${REPO}/pulls/${NUMBER}/reviews?per_page=100" --jq '.[]' \
          > "${dir}/reviews.jsonl"
        script="${{ github.action_path }}/../../../scripts/r3_review.py"

        # Whose approval would count, if they can write (#860). The list is empty for a
        # pull request without the label, so no lookup is made for it. An account whose
        # permission cannot be read is recorded as null — not an approval — and the
        # decision goes on: one failed lookup must not hide another approver's review,
        # and must never read as "may write".
        python3 "${script}" --pull "${dir}/pull.json" --reviews "${dir}/reviews.jsonl" \
          --label "${LABEL}" --candidates > "${dir}/candidates"
        echo '{}' > "${dir}/permissions.json"
        while IFS= read -r login; do
          [ -n "${login}" ] || continue
          permission=""
          if [[ "${login}" =~ ^[A-Za-z0-9-]+$ ]]; then
            if ! permission="$(gh api "repos/${REPO}/collaborators/${login}/permission" \
                --jq '.permission' 2> "${dir}/lookup.err")"; then
              permission=""
              echo "::warning::could not read the repository permission of ${login}; their approval does not count"
            fi
          else
            echo "::warning::${login} is not an account name this check looks up; their approval does not count"
          fi
          jq --arg login "${login}" --arg permission "${permission}" \
            '. + {($login): (if $permission == "" then null else $permission end)}' \
            "${dir}/permissions.json" > "${dir}/permissions.next"
          mv "${dir}/permissions.next" "${dir}/permissions.json"
        done < "${dir}/candidates"

        status=0
        python3 "${script}" \
          --pull "${dir}/pull.json" --reviews "${dir}/reviews.jsonl" --label "${LABEL}" \
          --permissions "${dir}/permissions.json" \
          > "${dir}/out" || status=$?
        cat "${dir}/out" >> "$GITHUB_OUTPUT"
        sed -n 's/^reason=//p' "${dir}/out" >> "$GITHUB_STEP_SUMMARY"
        sed -n 's/^reason=//p' "${dir}/out"
        exit "${status}"
