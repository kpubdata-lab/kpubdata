# PR title is a required check. Issues intentionally have no title enforcement or
# automatic type labels: Lean Engineering Process (#979).
# Keep the workflow name and "PR title" job name unchanged for branch protection.
name: Titles

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pull-request:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The action is this repository's own, so it has to be checked out first. The
      # other three repositories reference it remotely and need no checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The title is read live, not from the event payload: a re-run replays the old
      # payload, and the refresh workflow re-runs a failed check once the title is
      # fixed (#759). A failed lookup fails the step — it must never read as valid.
      - name: Read the current title
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          title=$(gh api "repos/${REPO}/pulls/${NUMBER}" -q .title)
          # A random delimiter, so no title can close the heredoc early (#628).
          delimiter="TITLE_$(openssl rand -hex 16)"
          {
            echo "title<<${delimiter}"
            printf '%s\n' "${title}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Parse the title
        id: title
        uses: ./.github/actions/conventional-title
        with:
          title: ${{ steps.current.outputs.title }}
          pull-request: "true"

      - name: The title must follow the convention
        env:
          VALID: ${{ steps.title.outputs.valid }}
          ERROR: ${{ steps.title.outputs.error }}
          LABEL: ${{ steps.title.outputs.label }}
        run: |
          if [ "${VALID}" != "true" ]; then
            echo "::error::${ERROR}"
            exit 1
          fi
          echo "title ok (${LABEL})"

