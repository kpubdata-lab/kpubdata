# Live probe — nightly reachability check (#465, #625)
#
# Runs `kpubdata probe` against real APIs and writes the result to
# docs/status/probe-result.json. Consumers:
#   - builder cross-repo E2E reads this to decide live vs fixture (#282)
#   - drift detection compares consecutive results (#382)
#
# Fork PRs cannot access secrets, so the probe is skipped there entirely.
name: Live probe

on:
  schedule:
    - cron: "0 18 * * *"  # 03:00 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe all spec datasets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip on fork PRs (no secrets available)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run probe
        env:
          KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
          KPUBDATA_BOK_API_KEY: ${{ secrets.KPUBDATA_BOK_API_KEY }}
          KPUBDATA_KOSIS_API_KEY: ${{ secrets.KPUBDATA_KOSIS_API_KEY }}
          KPUBDATA_SEOUL_API_KEY: ${{ secrets.KPUBDATA_SEOUL_API_KEY }}
          KPUBDATA_SGIS_API_KEY: ${{ secrets.KPUBDATA_SGIS_API_KEY }}
          KPUBDATA_SGIS_CONSUMER_SECRET: ${{ secrets.KPUBDATA_SGIS_CONSUMER_SECRET }}
          KPUBDATA_KIPRIS_API_KEY: ${{ secrets.KPUBDATA_KIPRIS_API_KEY }}
          KPUBDATA_KOREAN_API_KEY: ${{ secrets.KPUBDATA_KOREAN_API_KEY }}
          KPUBDATA_LAW_API_KEY: ${{ secrets.KPUBDATA_LAW_API_KEY }}
        run: |
          uv run kpubdata probe --output docs/status/probe-result.json --runner github-actions

      - name: Summarize
        run: |
          echo "## Probe results" >> $GITHUB_STEP_SUMMARY
          uv run python -c "
          import json
          from collections import Counter
          data = json.load(open('docs/status/probe-result.json'))
          results = data.get('results', [])
          counts = Counter(r.get('status', 'unknown') for r in results)
          with open('$GITHUB_STEP_SUMMARY', 'a') as summary:
              for status, count in sorted(counts.items()):
                  print(f'- {status}: {count}', file=summary)
          "

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: probe-result
          path: docs/status/probe-result.json

  drift:
    name: Detect drift against the previous night
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Filing the transition issue needs issues: write; the probe job stays at
    # the workflow-level contents: read.
    permissions:
      contents: read
      issues: write
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # This run's verdict, uploaded by the probe job a moment ago.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: probe-result
          path: current

      # The previous successful run: its verdict to compare against, and the
      # drift state its drift step left behind. `--status success` cannot see
      # this still-running run, so index 0 is the previous night. A first-ever
      # run downloads nothing and the state starts empty.
      - name: Download the previous run's artifacts
        run: |
          run_id=$(gh run list --repo "${REPO}" --workflow live-probe.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "${run_id}" ]; then
            gh run download "${run_id}" --repo "${REPO}" -n probe-result -D previous || true
            gh run download "${run_id}" --repo "${REPO}" -n drift-state -D state || true
            mkdir -p docs/status
            cp state/drift-state.json docs/status/ 2>/dev/null || true
          fi

      - name: Detect drift
        run: |
          args=(--current current/probe-result.json --state docs/status/drift-state.json)
          if [ -f previous/probe-result.json ]; then
            args+=(--previous previous/probe-result.json)
          fi
          uv run python scripts/drift_detect.py "${args[@]}" --create-issues true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: drift-state
          path: docs/status/drift-state.json
