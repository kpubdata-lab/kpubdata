# Build and publish the distribution. Two ways in, and neither of them pushes to main.
#
#   release: published   — a release made by hand in the GitHub UI
#   workflow_dispatch    — after release.yml has tagged (see below)
#
# **This has to stay the top-level workflow.** PyPI's trusted publisher matches the
# OIDC certificate's Build Config URI, which names the workflow GitHub *started*, not
# the one that ran. Calling this from release.yml as a reusable workflow made the
# certificate say `release.yml` and PyPI refused v0.7.0:
#
#   Certificate's Build Config URI (.../workflows/release.yml@refs/heads/main)
#   does not match expected Trusted Publisher (publish-pypi.yml @ yeongseon/kpubdata)
#
# So release.yml tags and creates the GitHub Release, and this is dispatched against
# that tag. One more click, no secret and no change to the PyPI account. Adding
# release.yml as a second trusted publisher on PyPI would remove the click; that is a
# change only the account owner can make (#593).
#
# The version bump used to live here and committed straight to main (#586). Branch
# protection refuses that now, and it should: the tag was created *before* the gates
# ran, so a failing test produced a tag pointing at a commit nobody would want.
name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish, e.g. v0.7.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, so the ref can be checked against main below.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # On both ways in: a release made by hand in the UI skipped this before, and it
      # is the path most likely to name the wrong tag. The ref reaches the shell through
      # the environment, never by expansion. One pattern: a version tag, optionally
      # with a PEP 440 pre-release (`v0.7.1a1`), with or without `refs/tags/`.
      - name: Validate the publish ref (#622)
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then REF="${INPUT_REF}"; else REF="${RELEASE_TAG}"; fi
          TAG="${REF#refs/tags/}"
          if ! printf '%s\n' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([a-z]+[0-9]+)?$'; then
            echo "::error::ref must be a version tag (vX.Y.Z), got: ${REF}"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} is not a tag in this repository"
            exit 1
          fi
          PYPROJECT_VER=$(grep '^version' pyproject.toml | cut -d'"' -f2)
          if [ "${TAG}" != "v${PYPROJECT_VER}" ]; then
            echo "::error::tag ${TAG} does not match pyproject version ${PYPROJECT_VER}"
            exit 1
          fi
          # Only what main contains is published — not a tag pushed on a side branch.
          if ! git merge-base --is-ancestor "refs/tags/${TAG}" origin/main; then
            echo "::error::${TAG} is not on main"
            exit 1
          fi
          echo "publishing ${TAG}"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # The gates run before anything is published, and — through release.yml — before
      # the tag exists at all. That ordering is the point of #586.
      - name: Run quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -ra

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (skip if already exists)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
