# Build and publish the distribution. Two ways in, and neither of them pushes to main.
#
#   release: published   — a release made by hand in the GitHub UI
#   workflow_call        — release.yml, after a release pull request merged
#
# The version bump used to live here and committed straight to main (#586). Branch
# protection refuses that now, and it should: the tag was created *before* the gates
# ran, so a failing test produced a tag pointing at a commit nobody would want.
name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_call:
    inputs:
      ref:
        description: "Tag or SHA to build from."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # The gates run before anything is published, and — through release.yml — before
      # the tag exists at all. That ordering is the point of #586.
      - name: Run quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -ra

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
