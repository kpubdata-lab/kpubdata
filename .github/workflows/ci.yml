name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The evidence-authorship gate reads run records to verify a recorder's
  # run_ref (#729); gh run view needs this on the default token.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 기본 shallow clone 은 커밋 하나만 가져오므로 fixture 변경의 저자를
          # 조회할 수 없다 (#523).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lockfile matches pyproject
        run: uv lock --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Korean comment gate (#517)
        run: uv run python scripts/check_english_comments.py src tests scripts

      - name: Mypy
        run: uv run mypy src

      - name: Validate dataset specs
        run: uv run python scripts/validate_spec.py

      - name: Contract replay verify
        run: make verify
        env:
          # 래칫의 기준 ref 는 명시적으로 (#766) — PR 에서는 base 브랜치,
          # main push 에서는 origin/main (PR 게이트를 통과한 자기 자신과의 비교).
          KPUBDATA_BASELINE_BASE: origin/${{ github.base_ref || 'main' }}

      - name: Generated docs drift check
        run: |
          uv run python scripts/gen_docs_examples.py --check
          uv run python scripts/gen_readme_datasets.py --check
          # docs/status.md was generated but never checked, so it drifted: it claimed
          # 22 spec and 149 catalogue datasets while the README said 23 and 150 (#498).
          uv run python scripts/gen_status_page.py --check

      # README 두 파일이 한쪽만 자라는 것을 막는다 (#546). ADR 0003 이 별도 영어
      # README 를 한 번 기각한 이유가 유지되지 않는 번역이었고, 이 검사가 그 이유를
      # 무력화한다. 절 구조만 본다 — 내용 동일성은 검사하지 않는다.
      - name: README parity
        run: uv run python scripts/check_readme_parity.py

      # POLICY 0.1: a review or verification level is written meaning first, code in
      # parentheses -- "unit tests (V1)", never a bare V2 (#878).
      - name: Plain review and verification codes
        run: uv run python scripts/check_plain_codes.py

      # ADR 0007 Rules 1-2: KPubData never depends on KPubData Builder or Studio.
      # Dependencies flow Studio -> Builder -> KPubData only (#668).
      - name: Independence (no Builder or Studio dependency)
        run: uv run python scripts/check_independence.py

      # fixture 는 "이 데이터셋은 검증됐다" 의 근거다. 판정 대상이 근거를 고칠 수
      # 있으면 판정이 반증 불가능해진다 (#497, #523). 녹화자 이름만으로는 부족하다 —
      # 메타의 run_ref 가 이 저장소의 녹화 워크플로 실행을 가리켜야 한다 (#729).
      - name: Recorded evidence authorship
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/check_fixture_authorship.py \
            --base "origin/${{ github.base_ref }}"

  spec-changes:
    name: Spec Change Summary
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed specs
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/kpubdata/specs/**/*.yaml' | sort)
          if [ -z "$CHANGED" ]; then
            echo "specs=" >> "$GITHUB_OUTPUT"
            echo "No spec files changed."
          else
            echo "specs<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "Changed specs:"
            echo "$CHANGED"
          fi

      - name: Comment PR with changed datasets
        if: steps.changed.outputs.specs != ''
        uses: actions/github-script@v9
        env:
          SPEC_FILES: ${{ steps.changed.outputs.specs }}
        with:
          script: |
            const marker = '<!-- spec-change-summary -->';
            const specs = process.env.SPEC_FILES;
            const datasets = specs.trim().split('\n').map(f => {
              const m = f.match(/specs\/(\w+)\/(\w+)\.yaml$/);
              return m ? `\`${m[1]}.${m[2]}\`` : f;
            });
            const body = `${marker}\n### Spec datasets changed in this PR\n\n${datasets.map(d => `- ${d}`).join('\n')}\n\n_Verify these datasets pass \`make verify\` before merging._`;

            // Update existing comment or create new one (idempotent)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest -ra

  coverage:
    # 커버리지 게이트 (#456). 지금 도달한 수준이 조용히 내려가지 않게 잠근다.
    # 하한은 pyproject 의 [tool.coverage.report] fail_under 한 곳에서만 관리한다.
    # 테스트 매트릭스(4개)에 --cov 를 얹지 않고 이 잡 하나만 계측한다 — 얻는 정보는
    # 같은데 비용만 4배이기 때문이다.
    name: Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests with coverage
        run: uv run pytest -ra --cov --cov-report=term-missing

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  base-install:
    name: Base install (no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # 모든 다른 잡이 --extra dev 로 설치한다. dev 는 pandas 와
      # typing_extensions 를 끌어오므로, "optional 이라고 선언했지만 실제로는
      # 필수"인 의존성이 CI 어디에도 걸리지 않았다. krx 어댑터의 pandas 와
      # typing_extensions 가 각각 그렇게 배포까지 나갔다.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with no extras
        run: pip install .

      - name: The package imports
        run: python -c "import kpubdata; print(kpubdata.__version__)"

      - name: The CLI runs and the catalog materializes every provider
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from kpubdata import Client; print(len(Client().datasets.list()), 'datasets')"
          kpubdata datasets list > /dev/null

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install mkdocs-material pymdown-extensions

      - name: Build docs (strict)
        run: mkdocs build --strict

  # One gate, so that editing the matrix is not also editing branch protection
  # (kpubdata-studio#416). Requiring a matrix-suffixed context means every matrix edit
  # is a protection edit, and the edit that gets forgotten leaves a required context
  # that is never produced. GitHub does not treat an absent check as a failure — it
  # waits, so every pull request stays BLOCKED with nothing to look at and the only
  # way past is `--admin`, which bypasses every other check too.
  #
  # `spec-changes` is left out on purpose: it is a summary for the reviewer, not a
  # verdict, and a gate that fails on it would block a pull request over a report.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.28.0"
      # sha256 of gitleaks_8.28.0_linux_x64.tar.gz from the release's checksums file,
      # pinned here so a tampered release cannot also swap its own checksum.
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # history, not just the tip: a key removed later is still leaked

      # The pinned binary rather than gitleaks-action, which needs a licence key for
      # organisations — a secret added in order to scan for secrets.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" gitleaks

      # Without --log-opts, gitleaks runs `git log --all`, which walks every ref
      # fetch-depth: 0 pulled in — including unmerged PR branches that have nothing
      # to do with this run (kpubdata-studio#685). Scope it to the commits this run
      # is actually responsible for.
      - name: Scope the scan to this run's own commits
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              # Only this PR's commits, base..head, so an unrelated open PR can't
              # fail this one.
              log_opts="${BASE_SHA}..${HEAD_SHA}"
              ;;
            push)
              if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
                # A new branch: no prior tip to diff against, so scan what the
                # branch brought in.
                log_opts="$PUSH_SHA"
              else
                log_opts="${BEFORE_SHA}..${PUSH_SHA}"
              fi
              ;;
            *)
              # schedule, workflow_dispatch: no run-specific range, so scan the
              # default branch's full history rather than every branch.
              log_opts="origin/${DEFAULT_BRANCH}"
              ;;
          esac
          echo "log-opts=${log_opts}" >> "$GITHUB_OUTPUT"

      # A leaked credential is never acceptable to merge, so this job is one of
      # `CI gate`'s needs (#631). The dependency audit and CodeQL live in security.yml.
      - name: Scan the full history
        run: ./gitleaks git . --redact --no-banner --log-level info --log-opts="${{ steps.scope.outputs.log-opts }}"

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [quality, test, coverage, build, base-install, docs, secret-scan]
    # `always()` so a failed job still reaches this step. Without it the gate is
    # skipped when something upstream fails, and a skipped required check is the same
    # absence this job exists to remove.
    if: always()
    steps:
      - name: Every job this gate covers must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream results: ${results}"
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error::CI gate failed — upstream results were: ${results}"
              exit 1
            fi
          done
          echo "every upstream job succeeded"
