# The release pull request, kept open by release-please (#819).
#
# release-please does two things here and no more: it works out the next version from
# the commit titles on `main` since the last tag, and it opens — then keeps up to date —
# the pull request that raises it. In 0.x a breaking change or a `feat` raises the minor
# and fixes alone raise the patch (`bump-minor-pre-major`), which is the rule in
# docs/compatibility.md §5.1. Commits that are none of these open nothing.
#
# Everything else stays where it was:
#
#   - The CHANGELOG is written by people under `[Unreleased]` (`skip-changelog`). The
#     second half of this job dates that section on the release branch, with the same
#     script the prepare job uses.
#   - `uv.lock` repeats the project's own version and release-please does not know it;
#     scripts/set_version.py writes it (kpubdata-builder#744).
#   - Nothing is tagged here (`skip-github-release`). Merging the pull request starts
#     release.yml, which checks the release window, runs the gates and only then tags.
#   - No labels (`skip-labeling`): POLICY 2.1 lists every label, and the tag is what
#     says a version is released.
#
# The token (#895). A pull request opened with GITHUB_TOKEN starts no `pull_request`
# workflows, so its required checks never report and it cannot be merged as it is. The
# owner chose a least-privilege GitHub App: this job mints a short-lived installation
# token from two secrets and gives it to release-please and to the push below, so the
# pull request and its later pushes start CI like anyone else's.
#
#   RELEASE_APP_CLIENT_ID     the App's Client ID (Settings -> Developer settings)
#   RELEASE_APP_PRIVATE_KEY   a private key generated for the App (the whole .pem)
#
# The App holds two repository permissions and nothing else: Contents read and write
# (the release branch) and Pull requests read and write (open and edit the pull
# request). The token is minted with the same two, so a wider App still yields a narrow
# token. It is never used to merge or approve; the no-workflow-merges test and the
# release-please tests (under tests/unit) hold that.
#
# Without the two secrets the job warns and falls back to GITHUB_TOKEN, as it worked
# before: the pull request still opens, and a person closes and reopens it to start the
# checks. Releases keep working on the day the App is not yet set up. With only one of
# the two secrets the job fails — that is a broken setup, not a missing one.
#
# release.yml's `mode=prepare` is still there for what this cannot do: a pre-release,
# and a critical patch inside the seven-day interval.
#
# Once a day, not on every push to `main`. Each run that changes the pull request
# pushes its branch twice — release-please's commit, then the lock file and CHANGELOG
# commit — and GitHub mails every subscriber for each push. On a day with a dozen
# merges that was two dozen mails about a pull request nobody may merge for a week
# (docs/compatibility.md §5.1). Run it by hand (`workflow_dispatch`) to bring the pull
# request up to date before a release.
name: Release please

on:
  schedule:
    # 21:00 UTC — 06:00 KST, before the working day.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    name: Open or update the release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID != '' }}
      HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Check the release App secrets
        id: app-secrets
        run: |
          if [ "${HAS_CLIENT_ID}" = "true" ] && [ "${HAS_PRIVATE_KEY}" = "true" ]; then
            echo "use=true" >> "$GITHUB_OUTPUT"
            echo "minting a release App token"
          elif [ "${HAS_CLIENT_ID}" = "true" ] || [ "${HAS_PRIVATE_KEY}" = "true" ]; then
            echo "::error title=Release App half configured::Set both RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY, or neither (docs/compatibility.md §5.1)."
            exit 1
          else
            echo "use=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No release App token::RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY are not set. Falling back to GITHUB_TOKEN: the release pull request opens, but its required checks do not start until a person closes and reopens it (docs/compatibility.md §5.1)."
          fi

      - name: Mint the release App token
        id: app
        if: steps.app-secrets.outputs.use == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - id: please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          skip-labeling: true

      # Only when release-please wrote the branch in this run. It rebuilds the branch
      # from `main` each time it does, so the two commits below are made again rather
      # than carried over.
      - name: Read the release branch
        id: branch
        if: steps.please.outputs.pr
        env:
          PR: ${{ steps.please.outputs.pr }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          pr = json.loads(os.environ["PR"])
          print(f"name={pr['headBranchName']}")
          print(f"number={pr['number']}")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.please.outputs.pr
        with:
          ref: ${{ steps.branch.outputs.name }}
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Read the version release-please chose
        id: version
        if: steps.please.outputs.pr
        run: |
          version=$(python3 -c "
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          print(re.search(r'^version = \"([^\"]+)\"', text, re.MULTILINE).group(1))
          ")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release-please chose ${version}"

      - name: Write the version into the lock file
        if: steps.please.outputs.pr
        uses: ./.github/actions/set-version
        with:
          version: ${{ steps.version.outputs.version }}

      # An empty `[Unreleased]` fails here: something releasable merged without saying
      # what it changes. The release job would refuse the same thing later, at the tag.
      - name: Date the CHANGELOG section
        if: steps.please.outputs.pr
        uses: ./.github/actions/release-notes
        with:
          command: promote
          version: ${{ steps.version.outputs.version }}

      - name: Push what release-please does not write
        if: steps.please.outputs.pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "nothing to add: the lock file and the CHANGELOG already say ${VERSION}"
            exit 0
          fi
          git --no-pager diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: write the lock file and date the CHANGELOG for v${VERSION}"
          git push origin "HEAD:${BRANCH}"
