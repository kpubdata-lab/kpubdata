# Release under branch protection (#586).
#
# The old flow bumped the version, committed to main and tagged, all before any gate
# ran. Protection refuses that push now, and the ordering was wrong anyway: the tag
# existed before the tests did, so a failing build left a tag pointing at a commit
# nobody wanted.
#
# Two entry points, neither of which writes to main directly.
#
#   workflow_dispatch, mode=prepare         opens a release pull request
#   workflow_dispatch, mode=release         gates what is declared now, then tags
#   pull_request closed on `release/*`      the same, for the pull request path
#
# The release pull request is normally the one release-please keeps open
# (release-please.yml, #819) — its branch starts with `release-please--branches--main`, and
# merging it lands in the same release job. `mode=prepare` stays for what
# release-please does not do: a pre-release, and a critical patch inside the interval.
#
# `mode=release` exists because a first release is not a bump. Both applications
# already declare the version their CHANGELOG says they are preparing, so raising it
# would leave that version unreleased for ever. The declared version is read from the
# file, never typed, so there is no place for a wrong number to enter.
#
# The second half cannot be a separate workflow triggered by the tag: events created
# with GITHUB_TOKEN do not start workflows. So the gates, the tag and the release are
# one job, and publishing is a reusable call rather than a copy.
#
# Known limit, and the reason the gates run again on merge: a pull request opened with
# GITHUB_TOKEN does not trigger `pull_request` workflows either, so the release pull
# request itself arrives without CI. Correctness does not depend on that — nothing is
# tagged until the gates pass here. Giving the workflow a PAT would make the pull
# request red before merging instead of after, and that needs a secret only the owner
# can create.
name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare = open a release pull request; release = tag what is declared now"
        required: true
        type: choice
        options:
          - prepare
          - release
        default: prepare
      bump:
        description: "Which part of the version to raise (mode=prepare only)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - pre
        default: patch
      dry_run:
        description: "Work out the new version and stop (mode=prepare only)"
        required: false
        type: boolean
        default: false
      critical_patch:
        description: "Release inside the 7-day interval as a critical patch (security or release-blocking fix)"
        required: false
        type: boolean
        default: false
      critical_issue:
        description: "The issue the critical patch fixes, e.g. #123 (required with critical_patch)"
        required: false
        type: string
        default: ""

  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  prepare:
    name: Open the release pull request
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare'
    timeout-minutes: 10
    # At job level, not workflow level: every closed pull request starts this
    # workflow, and a workflow-level group queued those runs against a real release —
    # a pending run in a group is replaced by the next one, so an ordinary PR closing
    # could cancel a release waiting its turn.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # First, before a version is worked out or a branch exists (#685). kpubdata
      # releases on demand, at most once every seven days; a critical patch that names
      # its issue may go sooner. A dry run reports what a real run would decide and
      # carries on, so it can still be used to check the version.
      - name: Release window
        uses: ./.github/actions/release-window
        with:
          policy: on-demand
          critical_patch: ${{ inputs.critical_patch }}
          critical_issue: ${{ inputs.critical_issue }}
          report_only: ${{ inputs.dry_run }}

      # The local reference, so this repository's own release exercises the action the
      # other two call remotely. An action nobody here uses is one that breaks for
      # them first.
      - name: Work out the new version
        id: bump
        uses: ./.github/actions/next-version
        with:
          bump: ${{ inputs.bump }}

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "dry run: would release ${{ steps.bump.outputs.tag }}"
          echo "nothing written, no branch pushed, no pull request opened"

      # Not just pyproject.toml. `uv.lock` repeats the project's own version, and
      # writing one without the other fails `uv lock --check` — nine checks red from a
      # one-line change, which is how kpubdata-builder#744 went.
      - name: Write the version
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/set-version
        with:
          version: ${{ steps.bump.outputs.new_version }}

      # The release pull request carries its own CHANGELOG change: `[Unreleased]` becomes
      # this version, dated. 0.7.0 shipped with its entries still under `[Unreleased]`
      # because nothing did this. An empty `[Unreleased]` stops here, before a branch.
      - name: Date the CHANGELOG section
        if: ${{ !inputs.dry_run }}
        uses: ./.github/actions/release-notes
        with:
          command: promote
          version: ${{ steps.bump.outputs.new_version }}

      - name: Show what changed
        if: ${{ !inputs.dry_run }}
        run: git --no-pager diff --stat

      - name: Open the pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          CRITICAL_ISSUE: ${{ inputs.critical_patch && inputs.critical_issue || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/${TAG}"
          git add -A
          git commit -m "chore: release ${TAG}"
          git push origin "release/${TAG}"
          printf '%s\n' \
            "\`${TAG}\` 릴리스 준비 (#586)." \
            "" \
            "이 PR 이 병합되면 게이트가 돌고, **통과한 뒤에** 태그·릴리스·PyPI 발행이 이어진다." \
            "예전에는 순서가 반대였다 — 태그가 먼저 생기고 테스트가 나중에 돌았다." \
            "" \
            "실패하면 남는 것이 없다. 다시 눌러도 된다." \
            > /tmp/release-body.md
          # The merge path has no inputs, so a critical patch travels in the body: the
          # release job reads this line back (#685).
          if [ -n "${CRITICAL_ISSUE}" ]; then
            printf '\nCritical-Patch: %s\n' "${CRITICAL_ISSUE}" >> /tmp/release-body.md
          fi
          gh pr create --base main --head "release/${TAG}" \
            --title "chore: release ${TAG}" --body-file /tmp/release-body.md

  release:
    name: Gate, tag and release
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       (startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')))
    timeout-minutes: 20
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # On the pull request path, the merge commit itself — not `main`, which by then
      # may be whatever merged next, a different tree from the one gated below. On a
      # dispatch there is no merge commit, so it is main's head, and the SHA is pinned
      # below so the tag cannot land on something else.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      # The merge path cannot take workflow inputs, so a critical patch is declared by a
      # `Critical-Patch: #N` line in the release pull request's body — the prepare job
      # writes it, and a person can add it. The body reaches the shell through the
      # environment, never by expansion.
      - name: Read a critical-patch declaration
        id: critical
        env:
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          INPUT_PATCH: ${{ inputs.critical_patch }}
          INPUT_ISSUE: ${{ inputs.critical_issue }}
        run: |
          if [ "${EVENT}" = "pull_request" ]; then
            issue=$(printf '%s\n' "${PR_BODY}" | tr -d '\r' \
              | sed -n -E 's/^Critical-Patch:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' | head -n 1)
            patch=$([ -n "${issue}" ] && echo true || echo false)
          else
            issue="${INPUT_ISSUE}"
            patch="${INPUT_PATCH:-false}"
          fi
          echo "patch=${patch}" >> "$GITHUB_OUTPUT"
          echo "issue=${issue}" >> "$GITHUB_OUTPUT"

      # Before the gates, the tag and anything else is written (#685). Prepare
      # refuses first, so this only stops a release pull request merged outside the rule.
      # Then the raised version sits on main untagged, and nothing needs undoing:
      # dispatch mode=release in the window, or now with critical_patch and
      # critical_issue. Re-running this job does not help — it replays the same event,
      # so a Critical-Patch line added to the body after the merge is not seen.
      - name: Release window
        uses: ./.github/actions/release-window
        with:
          policy: on-demand
          critical_patch: ${{ steps.critical.outputs.patch }}
          critical_issue: ${{ steps.critical.outputs.issue }}

      - name: Pin the commit being released
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read the version being released
        id: tag
        run: |
          version=$(python3 -c "
          import pathlib, re
          text = pathlib.Path('pyproject.toml').read_text(encoding='utf-8')
          print(re.search(r'^version = \"([^\"]+)\"', text, re.MULTILINE).group(1))
          ")
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "releasing v${version}"

      # The tag is read out of pyproject.toml in this same job, so the two cannot
      # disagree by accident. This catches the one way they can: someone editing the
      # release pull request. Tagging the wrong one is how an artifact ends up
      # labelled with a version it does not contain (kpubdata-builder#690).
      - name: The branch name and the file must agree
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # release-please's branch has one name for every release (#819), so there the
          # version is in the title it wrote — `pull-request-title-pattern`. The name is a
          # prefix: release-please appends `--components--<package>` to it, which the
          # first real pull request (#830) showed and an exact match did not expect.
          case "${BRANCH}" in release-please--branches--main*) from_release_please=true ;; *) from_release_please=false ;; esac
          if [ "${from_release_please}" = "true" ]; then
            if [ "${TITLE}" != "chore: release ${TAG}" ]; then
              echo "::error::the pull request is titled '${TITLE}' but pyproject.toml says ${TAG}"
              exit 1
            fi
          elif [ "${BRANCH}" != "release/${TAG}" ]; then
            echo "::error::branch is ${BRANCH} but pyproject.toml says release/${TAG}"
            exit 1
          fi

      # Before the gates, not after. #586 is about a release that failed with a tag
      # already created; spending ten minutes to then say "tag exists" is the same
      # shape of waste one step earlier. A tag already on *this* commit is a re-run
      # after the push succeeded and `gh release create` did not; that run carries on
      # and finishes the release instead of being stuck for ever.
      - name: The tag is free, or already on this commit
        id: existing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if tagged=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            if [ "${tagged}" != "${SHA}" ]; then
              echo "::error::${TAG} already exists on ${tagged}, not on ${SHA}. Nothing to release, or the version was not raised."
              exit 1
            fi
            echo "::notice::${TAG} already points at ${SHA}; finishing the release"
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "${TAG} is free"
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi

      # The notes are the CHANGELOG section, not a list of pull request titles. Taken
      # before the gates so a missing or empty section stops the release while there
      # is still nothing to clean up.
      - name: Release notes from the CHANGELOG
        id: notes
        uses: ./.github/actions/release-notes
        with:
          command: extract
          version: ${{ steps.tag.outputs.tag }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Everything that has to be true before a tag exists. This is the ordering #586
      # is about: a failure here leaves no tag, no release and nothing to clean up.
      - name: Run quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -ra

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
          TAGGED: ${{ steps.existing.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${TAGGED}" != "true" ]; then
            git tag "${TAG}" "${SHA}"
            git push origin "${TAG}"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::the ${TAG} release already exists"
          else
            gh release create "${TAG}" --title "${TAG}" \
              --notes-file "${NOTES}" --target "${SHA}"
          fi

  # Publishing is not called from here. PyPI's trusted publisher matches the
  # workflow GitHub started, so a reusable call made the certificate say
  # `release.yml` and the upload was refused. publish-pypi.yml is dispatched against
  # the tag this job created — see its header, and #593 for removing the extra step.
  say-what-is-next:
    name: Say what to do next
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Next step
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          echo "::notice::${TAG} is tagged and released. Publish it with:"
          echo "::notice::  gh workflow run publish-pypi.yml -f ref=${TAG}"
