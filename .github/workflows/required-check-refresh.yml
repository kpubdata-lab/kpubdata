# Refresh only stale SDK title-check runs. The owner retired SDK R3 review;
# shared non-SDK review actions and repository protections remain independent.
name: Required check refresh

on:
  workflow_run:
    workflows: ["Titles"]
    types: [completed]

permissions:
  actions: write

jobs:
  refresh:
    name: Re-run stale failed runs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'pull_request_review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the failed runs of the same check on the same head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          PASSED: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          stale=$(gh api --paginate \
            "repos/${REPO}/actions/workflows/${WORKFLOW_ID}/runs?head_sha=${SHA}&status=completed&per_page=100" \
            --jq ".workflow_runs[]
                  | select(.id != ${PASSED})
                  | select(.event == \"pull_request\" or .event == \"pull_request_review\")
                  | select(.conclusion == \"failure\" or .conclusion == \"cancelled\" or .conclusion == \"timed_out\")
                  | .id")
          if [ -z "${stale}" ]; then
            echo "no stale failed run on ${SHA}"
            exit 0
          fi
          for id in ${stale}; do
            echo "re-running ${id}"
            gh run rerun "${id}" --repo "${REPO}"
          done
