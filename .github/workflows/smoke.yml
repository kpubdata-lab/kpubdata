# Live API smoke for an approved domestic self-hosted runner.
# During MVP, live checks are run manually on a trusted Korean workstation.
# Do not dispatch this workflow without an approved, isolated "self-hosted, kr"
# runner, authorised API credentials and the HTTPS preconditions in
# docs/manual-live-smoke.md (#887, #893). No recurring runner is required now.
name: Smoke (live)

on:
  # Manual dispatch is retained for a future, separately approved domestic runner.
  # No schedule or automatic push trigger during the MVP manual-only phase.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-live
  cancel-in-progress: false

jobs:
  datago-live:
    name: datago 실API 스모크
    runs-on: [self-hosted, kr]
    timeout-minutes: 20
    env:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The runner host is a plain VM: nothing is preinstalled for this job, so uv comes
      # from the pinned action, as in build-dataset.yml's re-record job.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Run datago live integration tests
        run: |
          KPUBDATA_MODE= KPUBDATA_CACHE=0 uv run pytest -o addopts= -m integration tests/integration/test_datago_live.py \
            -rf --durations=10 --junitxml=smoke-datago.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: smoke-datago
          path: smoke-datago.xml
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          # 요약을 인라인으로 두면 아무도 테스트할 수 없다. 그래서 root 에서
          # 카운트를 읽는 결함이 오래 남았고, 실패한 실행에 smoke=PASS 를
          # 찍었다 (#516). 스크립트에는 테스트가 붙어 있다.
          #
          # A report with no passing test is not evidence of a real API check.
          # Fail if the report is missing or every selected test was skipped.
          if [ -f smoke-datago.xml ]; then
            python3 scripts/junit_summary.py smoke-datago.xml --label "datago live" --require-passed
          else
            echo "datago live: no report produced"
            echo "smoke=FAIL"
            exit 1
          fi

  drift-report:
    name: 드리프트 리포트 (2회 연속 실패 → 이슈)
    needs: datago-live
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # scripts/report_drift.py lists this workflow's runs and downloads their result
    # artifacts (actions: read), and files or updates the drift issue (issues: write).
    # The workflow default is contents: read alone, under which both were refused (#859).
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Run drift report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet httpx
          python3 scripts/report_drift.py
