# 데이터셋 실API 스모크 (일 1회, 국내 self-hosted 러너)
#
# 왜 국내 러너인가: data.go.kr 등 한국 공공 API는 해외 IP의 인증 호출을 드롭한다
# (호스티드 러너에서 전량 타임아웃, 국내에서 통과 — 실증: #383).
# 러너 라벨 `kr` 은 국내 VM/devbox의 self-hosted runner(kr-runner-01)를 가리킨다.
# Phase 2의 `LIVE=1 make verify` 체계가 완성되면 이 워크플로우는 그 위로 재편성된다 (#382).
name: Smoke (live)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 10:00 KST — 국내 API 새벽 점검 시간대 회피
  push:
    branches: [main]
    paths:
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

concurrency:
  group: smoke-live
  cancel-in-progress: false

jobs:
  datago-live:
    name: datago 실API 스모크
    runs-on: [self-hosted, kr]
    timeout-minutes: 20
    env:
      KPUBDATA_DATAGO_API_KEY: ${{ secrets.KPUBDATA_DATAGO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run datago live integration tests
        run: |
          uv run pytest -m integration tests/integration/test_datago_live.py \
            -rf --durations=10 --junitxml=smoke-datago.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: smoke-datago
          path: smoke-datago.xml
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          # 요약을 인라인으로 두면 아무도 테스트할 수 없다. 그래서 root 에서
          # 카운트를 읽는 결함이 오래 남았고, 실패한 실행에 smoke=PASS 를
          # 찍었다 (#516). 스크립트에는 테스트가 붙어 있다.
          #
          # 이 단계는 실패해도 job 결과를 바꾸지 않는다 — pytest 종료 코드가
          # 이미 그 역할을 한다. 다만 요약이 거짓말하지는 않는다.
          if [ -f smoke-datago.xml ]; then
            python3 scripts/junit_summary.py smoke-datago.xml --label "datago live" || true
          else
            echo "datago live: no report produced"
            echo "smoke=FAIL"
          fi

  drift-report:
    name: 드리프트 리포트 (2회 연속 실패 → 이슈)
    needs: datago-live
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # scripts/report_drift.py lists this workflow's runs and downloads their result
    # artifacts (actions: read), and files or updates the drift issue (issues: write).
    # The workflow default is contents: read alone, under which both were refused (#859).
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Run drift report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --quiet httpx
          python3 scripts/report_drift.py
