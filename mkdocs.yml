site_name: KPubData
site_url: https://yeongseon.github.io/kpubdata
site_description: 한국 공공데이터 접근 프레임워크
repo_url: https://github.com/yeongseon/kpubdata
repo_name: yeongseon/kpubdata

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.integrate
    - search.suggest

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - 홈: index.md
  - 시작하기:
      - 빠른 시작: quickstart.md
      - CLI: cli.md
      - 데이터셋 예제: dataset-examples.md
      - 터미널 예시: terminal-captures.md
      - 검증 상태: status.md
  - 가이드:
      - 캐싱: caching.md
      - Provider 호스트 허용 목록: host-allowlist.md
      - 로깅: logging.md
      - Cookbook:
          - 시작하기: cookbook/getting-started.md
          - 데이터셋 탐색: cookbook/discovery.md
          - Raw 접근: cookbook/raw-access.md
  - Providers:
      - 공공데이터포털 (datago): providers/datago.md
      - 서울 열린데이터광장: providers/seoul.md
      - 통계청 KOSIS: providers/kosis.md
      - 한국은행 BOK: providers/bok.md
      - 지방재정365 (lofin): providers/lofin.md
      - 지방행정인허가 (localdata): providers/localdata.md
      - 소상공인 상가정보 (semas): providers/semas.md
      - 통계지리정보 (sgis): providers/sgis.md
      - 식품의약품안전처 (fds): providers/fds.md
      - 특허정보검색 KIPRIS (kipris): providers/kipris.md
      - 국립국어원 (korean): providers/korean.md
      - 한국거래소 KRX (krx): providers/krx.md
      - 국가법령정보센터 (law): providers/law.md
      - 교육부 나이스 (neis): providers/neis.md
  - 아키텍처:
      - 시스템 구조: architecture-diagrams.md
      - Product Family: product-family-architecture.md
      - 호환성 매트릭스: compatibility.md
      - datago API 참고: datago-api-reference.md
      - 데이터셋 상태 전이: DATASET_STATUS.md
      - Live Probe: LIVE_PROBE.md
      - Production-grade 기준: PRODUCTION_GRADE.md
      - 데이터셋 수요 목록: dataset-demand-list.md
  - ADR:
      - "0001: Dialect 아키텍처": adrs/0001-dialect-inspired-architecture.md
      - "0002: UX 표준화": adrs/0002-standardize-ux-not-native-shape.md
      - "0003: 언어 정책": adrs/0003-language-policy.md
      - "0004: 버전 정책": adrs/0004-versioning-and-release.md
      - "0005: 데이터셋 상태 어휘": adrs/0005-dataset-status-vocabulary.md
      - "0006: 컬럼 메타 계약": adrs/0006-column-metadata-contract.md
  - 튜토리얼:
      - AI 에이전트 워크플로우: tutorial-ai-agent-workflow.md
  - 기여:
      - 기여 가이드: contributing.md
