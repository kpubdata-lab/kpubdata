[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kpubdata"
version = "0.9.0"
description = "Dialect-inspired Python access framework for Korean public data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yeongseon Choe" }
]
keywords = [
  "korea",
  "public-data",
  "openapi",
  "sdk",
  "framework",
  "data-access",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "typing-extensions>=4.10; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/kpubdata-lab/kpubdata"
Documentation = "https://kpubdata-lab.github.io/kpubdata"
Repository = "https://github.com/kpubdata-lab/kpubdata"
Issues = "https://github.com/kpubdata-lab/kpubdata/issues"
Changelog = "https://github.com/kpubdata-lab/kpubdata/blob/main/CHANGELOG.md"

[project.scripts]
kpubdata = "kpubdata.cli:main"

[project.optional-dependencies]
xml = [
  "xmltodict>=0.13,<2",
]
pandas = [
  "pandas>=2.2,<3",
]
krx = [
  "pykrx>=1.0.45,<2",
]
validation = [
  "pydantic>=2.7,<3",
]
mcp = [
  "mcp>=1,<3",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<3",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "pykrx>=1.0.45,<2",
  "ruff>=0.5,<1",
  "xmltodict>=0.13,<2",
]
docs = [
  "mkdocs-material>=9.5,<10",
  "pymdown-extensions>=10,<13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kpubdata"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 테스트 코드는 시나리오를 설명하는 한글 주석/문자열로 줄이 길어질 수 있어
# E501(줄 길이)만 면제한다. 다른 규칙과 src 코드에는 그대로 적용된다.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

# 커버리지 게이트 (#456). 목적은 새 커버리지를 강제하는 게 아니라 이미 도달한
# 수준(실측 91%)이 조용히 내려가지 않게 잠그는 것이다. 하한은 실측보다 2%p 낮게
# 두어 정상 변동으로 CI 가 붉어지지 않게 한다.
#
# `--cov` 를 기본 addopts 에 넣지 않는다: 테스트 잡이 4개(py3.10~3.13)라 전부에
# 계측을 걸면 같은 정보를 4배 비용으로 사고, 로컬 `pytest` 도 함께 느려진다.
# CI 의 Python 3.12 테스트 레그 하나만 `--cov` 로 실행해 게이트를 담당한다.
#
# 수치는 기본 마커 조합(`-m 'not integration'`) 기준이다 — integration 은 실 API
# 키가 필요해 CI 에서 항상 deselect 되므로, 게이트가 보는 값과 개발자가 로컬에서
# 보는 값이 같다.
[tool.coverage.run]
source = ["src/kpubdata"]

[tool.coverage.report]
fail_under = 89
show_missing = true

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration'"
markers = ["integration: real API integration tests (require API keys)"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "types-pyyaml>=6.0.12.20260906",
]
