[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kpubdata"
version = "0.11.0"
description = "Dialect-inspired Python access framework for Korean public data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Yeongseon Choe" }
]
keywords = [
  "korea",
  "public-data",
  "openapi",
  "sdk",
  "framework",
  "data-access",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "typing-extensions>=4.10; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/kpubdata-lab/kpubdata"
Documentation = "https://kpubdata-lab.github.io/kpubdata"
Repository = "https://github.com/kpubdata-lab/kpubdata"
Issues = "https://github.com/kpubdata-lab/kpubdata/issues"
Changelog = "https://github.com/kpubdata-lab/kpubdata/blob/main/CHANGELOG.md"

[project.scripts]
kpubdata = "kpubdata.cli:main"

[project.optional-dependencies]
xml = [
  "xmltodict>=0.13,<2",
]
pandas = [
  "pandas>=2.2,<3",
]
krx = [
  "pykrx>=1.0.45,<2",
]
validation = [
  "pydantic>=2.7,<3",
]
mcp = [
  "mcp>=1,<3",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<3",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "pykrx>=1.0.45,<2",
  "ruff>=0.5,<1",
  "xmltodict>=0.13,<2",
]
docs = [
  "mkdocs-material>=9.5,<10",
  "pymdown-extensions>=10,<13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kpubdata"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 테스트 코드는 시나리오를 설명하는 한글 주석/문자열로 줄이 길어질 수 있어
# E501(줄 길이)만 면제한다. 다른 규칙과 src 코드에는 그대로 적용된다.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

# The Python 3.12 --extra dev suite measured 93.84% after this support change.
# Raise the floor from 89% to 91% to retain regression sensitivity (#456).
# All-extras smoke runs afterward and does not change the measured profile.
#
# Keep --cov out of addopts: instrumenting every Python 3.11–3.14 job
# repeats the same measurement and slows local pytest. Only the Python 3.12
# test leg measures coverage and enforces the configured floor.
#
# 수치는 기본 마커 조합(`-m 'not integration'`) 기준이다 — integration 은 실 API
# 키가 필요해 CI 에서 항상 deselect 되므로, 게이트가 보는 값과 개발자가 로컬에서
# 보는 값이 같다.
[tool.coverage.run]
source = ["src/kpubdata"]

[tool.coverage.report]
fail_under = 91
show_missing = true

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration'"
markers = ["integration: real API integration tests (require API keys)"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "types-pyyaml>=6.0.12.20260906",
]
